<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛸%3C/text%3E%3C/svg%3E" />
    <title>NEON VOID</title>
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; width: 100%; touch-action: none; }
      #game { display: block; width: 100vw; height: 100vh; }
      #hud {
        position: fixed; top: 16px; left: 20px; z-index: 10;
        font-family: 'Courier New', monospace; color: #0ff;
        text-shadow: 0 0 8px #0ff; pointer-events: none; user-select: none;
      }
      #hud .score { font-size: 28px; letter-spacing: 4px; }
      #hud .lives { font-size: 18px; margin-top: 4px; }
      #hud .best { font-size: 14px; margin-top: 6px; color: #ff0; text-shadow: 0 0 8px #ff0; }
      #overlay {
        position: fixed; inset: 0; z-index: 20;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: rgba(0,0,0,.72); font-family: 'Courier New', monospace; color: #0ff;
        text-shadow: 0 0 12px #0ff;
      }
      #overlay h1 { font-size: 64px; letter-spacing: 14px; margin: 0 0 12px; }
      #overlay p { font-size: 18px; letter-spacing: 2px; margin: 6px 0; }
      #overlay.hidden { display: none; }
      @media (max-width: 560px) {
        #overlay { padding: 0 18px; text-align: center; }
        #overlay h1 { font-size: 40px; letter-spacing: 8px; }
        #overlay p { font-size: 14px; letter-spacing: 1px; margin: 8px 0; }
        #hud .score { font-size: 22px; letter-spacing: 3px; }
        #hud .lives { font-size: 15px; }
        #hud .best { font-size: 12px; }
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div class="score">000000</div>
      <div class="lives">♥♥♥</div>
      <div class="best">BEST 000000</div>
    </div>
    <div id="overlay">
      <h1>NEON VOID</h1>
      <p>WASD / flechas — mover · ESPACIO — disparar · en móvil: arrastra (disparo automático)</p>
      <p>recoge cápsulas verdes (triple disparo) y amarillas (escudo)</p>
      <p>toca la pantalla o pulsa cualquier tecla para empezar</p>
    </div>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
